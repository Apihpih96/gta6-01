<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Coast</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas" aria-label="Solar Coast: an open-world coastal crime game"></canvas>
<p id="boot-error" role="alert" style="display:none"></p>

<!-- HUD -->
<div id="hud" aria-hidden="true">
  <div id="health-bar-container">
    <div id="health-bar-fill" style="width:100%;background:#44cc44"></div>
  </div>
  <div id="cash">$0</div>
  <div id="wanted-stars">☆☆☆☆☆</div>
  <div id="objective">Explore the city</div>
  <div id="police-nearby"></div>
  <div id="speed">0 km/h</div>
  <div id="weapon-slot">👊</div>
  <div id="center-message"></div>
  <div id="damage-vignette"></div>
  <div id="interact-prompt"></div>
  <div id="minimap-container"></div>
</div>

<!-- BUSTED overlay -->
<div id="busted-overlay" style="display:none">
  <div class="overlay-text">BUSTED</div>
</div>

<!-- WASTED overlay -->
<div id="wasted-overlay" style="display:none">
  <div class="overlay-text">WASTED</div>
</div>

<!-- Start screen overlay — semi-transparent so city shows through -->
<div id="start-screen">
  <div id="start-content">
    <h1 id="game-title">SOLAR COAST</h1>
    <p id="game-subtitle">An open-world coastal crime game</p>
    <div id="start-buttons">
      <button id="new-game-btn">New Game</button>
      <button id="continue-btn" disabled>Continue</button>
    </div>
    <div id="controls">
      <h3>Controls</h3>
      <table>
        <tr><td>WASD</td><td>Move</td></tr>
        <tr><td>Shift</td><td>Run</td></tr>
        <tr><td>Space</td><td>Jump</td></tr>
        <tr><td>Mouse</td><td>Look</td></tr>
        <tr><td>E</td><td>Enter/Exit vehicle</td></tr>
        <tr><td>F / Left click</td><td>Punch</td></tr>
        <tr><td>Esc</td><td>Pause</td></tr>
      </table>
    </div>
  </div>
</div>

<!-- Pause overlay -->
<div id="pause-screen" style="display:none">
  <div id="pause-content">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
